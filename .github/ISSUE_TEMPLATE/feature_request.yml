name: Feature request
description: Propose a change to gentle-emote.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. A proposal is not approved until the maintainer adds the `approved` label.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: benefits
    attributes:
      label: Benefits
    validations:
      required: true
